name: Deploy Cloud Functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias de functions
        working-directory: functions
        run: npm install

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Configurar secret RESEND_API_KEY en Firebase
        id: set_secret
        continue-on-error: true
        run: |
          set +e
          printf '%s' "${{ secrets.RESEND_API_KEY }}" | firebase functions:secrets:set RESEND_API_KEY \
            --project newmaritime-implementator \
            --data-file - \
            --force \
            --token "${{ secrets.FIREBASE_TOKEN }}" > secret_set.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat secret_set.log

      - name: Subir log de diagnostico si fallo
        if: steps.set_secret.outputs.exit_code != '0'
        run: |
          CONTENT=$(base64 -w0 secret_set.log)
          HTTP_CODE=$(curl -s -o upload_response.json -w "%{http_code}" -X PUT \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/functions/.deploy-debug.log" \
            -d "{\"message\":\"debug log\",\"content\":\"$CONTENT\"}")
          echo "HTTP $HTTP_CODE"
          cat upload_response.json

      - name: Detener si fallo el paso anterior
        if: steps.set_secret.outputs.exit_code != '0'
        run: exit 1

      - name: Deploy Cloud Functions
        id: deploy_functions
        continue-on-error: true
        run: |
          set +e
          firebase deploy --only functions --project newmaritime-implementator --token "${{ secrets.FIREBASE_TOKEN }}" > deploy.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat deploy.log

      - name: Subir log de diagnostico de deploy si fallo
        if: steps.deploy_functions.outputs.exit_code != '0'
        run: |
          CONTENT=$(base64 -w0 deploy.log)
          HTTP_CODE=$(curl -s -o upload_response2.json -w "%{http_code}" -X PUT \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/functions/.deploy-debug.log" \
            -d "{\"message\":\"deploy debug log\",\"content\":\"$CONTENT\"}")
          echo "HTTP $HTTP_CODE"
          cat upload_response2.json

      - name: Detener si fallo el deploy
        if: steps.deploy_functions.outputs.exit_code != '0'
        run: exit 1

      - name: Obtener URLs de las funciones
        if: steps.deploy_functions.outputs.exit_code == '0'
        run: |
          firebase functions:list --project newmaritime-implementator --token "${{ secrets.FIREBASE_TOKEN }}" > list.log 2>&1 || true
          cat deploy.log list.log > combined_urls.log
          CONTENT=$(base64 -w0 combined_urls.log)
          EXISTING_SHA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/contents/functions/.function-urls.log" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))")
          if [ -n "$EXISTING_SHA" ]; then
            curl -s -o /dev/null -w "%{http_code}\n" -X PUT \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/contents/functions/.function-urls.log" \
              -d "{\"message\":\"function urls\",\"content\":\"$CONTENT\",\"sha\":\"$EXISTING_SHA\"}"
          else
            curl -s -o /dev/null -w "%{http_code}\n" -X PUT \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/contents/functions/.function-urls.log" \
              -d "{\"message\":\"function urls\",\"content\":\"$CONTENT\"}"
          fi
